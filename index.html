<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>赤羽歯科・フレンドデンタルオフィス｜採用</title>

<!-- ===== やさしい丸ゴシックフォント（Zen Maru Gothic） ===== -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">

<style>
  /* ====== 色の設定（ここを変えると全体の色が変わります） ====== */
  :root {
    --mint:   #7ecabb;   /* メインのミント */
    --mint-d: #5fb3a3;   /* 濃いめミント（ボタン押した時など） */
    --pink:   #f6c6cd;   /* アクセントのピンク */
    --cream:  #fdf8f2;   /* カードの背景（クリーム） */
    --ink:    #4f5d58;   /* 文字色（やわらかい墨色） */
    --ink-l:  #8a978f;   /* うすい文字色 */
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: "Zen Maru Gothic", sans-serif;
    color: var(--ink);
    /* 背景：ミント→クリーム→ピンクのやわらかいグラデーション */
    background: linear-gradient(160deg, #e6f7f1 0%, #fdf8f2 45%, #fcecef 100%);
    background-attachment: fixed;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 28px 18px 48px;
    line-height: 1.7;
  }

  .wrap { width: 100%; max-width: 440px; }

  /* ====== ヘッダー（ロゴ2つ） ====== */
  .header { text-align: center; margin-bottom: 26px; }

  .logo-card {
    background: #fff;
    border-radius: 22px;
    padding: 20px 18px;
    box-shadow: 0 6px 20px rgba(126,202,187,0.22);
    display: flex; flex-direction: row; align-items: center; justify-content: center;
    gap: 16px;
  }
  .logo-card img {
    width: auto; height: auto;
    max-width: 42%;     /* 横幅の上限（大きすぎないように） */
    max-height: 50px;   /* 高さの上限 */
    object-fit: contain;
  }
  .logo-divider {
    flex: 0 0 1px;
    width: 1px; height: 42px;   /* 縦の区切り線 */
    background: #e7ece9;
  }
  .clinic-sub {
    margin-top: 16px;
    font-size: 13px; color: var(--ink-l); font-weight: 500;
    letter-spacing: 0.08em;
  }

  .lead {
    text-align: center;
    font-size: 14px;
    color: var(--ink);
    margin: 18px 4px 30px;
  }

  /* ====== セクション見出し ====== */
  .sec-title {
    display: flex; align-items: center; gap: 8px;
    font-size: 15px; font-weight: 700;
    margin: 30px 2px 14px;
  }
  .sec-title::before {
    content: ""; width: 18px; height: 18px;
    border-radius: 6px;
    background: var(--mint);
    display: inline-block;
  }

  /* ====== 動画カード ====== */
  .video-card {
    background: #fff;
    border-radius: 20px;
    padding: 12px 12px 14px;
    margin-bottom: 16px;
    box-shadow: 0 6px 20px rgba(95,179,163,0.14);
  }
  .video-label {
    font-size: 13px; font-weight: 700;
    margin: 4px 4px 10px;
    display: flex; align-items: center; gap: 6px;
  }
  .video-label .tag {
    font-size: 11px; font-weight: 500;
    background: #eafaf4; color: var(--mint-d);
    padding: 2px 8px; border-radius: 999px;
  }
  .video-frame {
    position: relative;
    width: 100%;
    aspect-ratio: 16 / 9;
    border-radius: 12px;
    overflow: hidden;
  }
  .video-frame iframe {
    position: absolute; inset: 0;
    width: 100%; height: 100%; border: 0;
  }

  /* ====== リンクボタン ====== */
  .btn {
    display: flex; align-items: center; gap: 12px;
    text-decoration: none;
    background: #fff;
    color: var(--ink);
    border-radius: 16px;
    padding: 16px 18px;
    margin-bottom: 13px;
    font-size: 15px; font-weight: 700;
    box-shadow: 0 5px 16px rgba(95,179,163,0.13);
    transition: transform .12s ease, box-shadow .12s ease;
    border: 2px solid transparent;
  }
  .btn:hover { transform: translateY(-2px); box-shadow: 0 8px 22px rgba(95,179,163,0.22); }
  .btn .ico {
    width: 40px; height: 40px; flex: 0 0 40px;
    border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px;
  }
  .btn .txt small {
    display: block; font-size: 11px; font-weight: 500; color: var(--ink-l);
  }
  .btn .arrow { margin-left: auto; color: var(--mint); font-weight: 700; }

  .btn.hp  .ico { background: #eafaf4; }
  .btn.rec .ico { background: #fcecef; }

  /* ====== フッター ====== */
  .footer {
    text-align: center;
    margin-top: 34px;
    font-size: 12px; color: var(--ink-l);
  }
  .footer a { color: var(--mint-d); text-decoration: none; }
</style>
</head>
<body>
  <div class="wrap">

    <!-- ========== ヘッダー（ロゴ2つ） ========== -->
    <header class="header">
      <div class="logo-card">
        <img src="images/logo-akabane.png" alt="赤羽歯科">
        <div class="logo-divider"></div>
        <img src="images/logo-friend.png" alt="フレンド・デンタル・オフィス">
      </div>
      <div class="clinic-sub">採用情報 / RECRUIT</div>
    </header>

    <p class="lead">
      私たちと一緒に働きませんか？<br>
      スタッフの日常や職場の雰囲気を動画で紹介しています🌷
    </p>

    <!-- ========== 動画セクション ========== -->
    <div class="sec-title">動画で見る</div>

    <!-- 動画①：寮紹介　※リンクを変えたい時はこの "vqejja9Ebt4" の部分を差し替え -->
    <div class="video-card">
      <div class="video-label">歯科衛生士 寮紹介 <span class="tag">寮</span></div>
      <div class="video-frame">
        <iframe src="https://www.youtube.com/embed/vqejja9Ebt4"
          title="歯科衛生士 寮紹介" allowfullscreen
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"></iframe>
      </div>
    </div>

    <!-- 動画②：業務紹介　※リンクを変えたい時はこの "m-xEN9TuHU4" の部分を差し替え -->
    <div class="video-card">
      <div class="video-label">歯科衛生士 業務紹介 <span class="tag">仕事</span></div>
      <div class="video-frame">
        <iframe src="https://www.youtube.com/embed/m-xEN9TuHU4"
          title="歯科衛生士 業務紹介" allowfullscreen
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"></iframe>
      </div>
    </div>

    <!-- ========== リンクボタン ========== -->
    <div class="sec-title">もっと知る</div>

    <!-- 採用サイト -->
    <a class="btn rec" href="https://www.akabaneshika.or.jp/recruit/" target="_blank" rel="noopener">
      <span class="ico">🌸</span>
      <span class="txt">採用サイトを見る<small>募集要項・エントリーはこちら</small></span>
      <span class="arrow">›</span>
    </a>

    <!-- 法人ホームページ -->
    <a class="btn hp" href="https://www.akabaneshika.or.jp/" target="_blank" rel="noopener">
      <span class="ico">🏥</span>
      <span class="txt">ホームページ<small>赤羽歯科・フレンドデンタルオフィス</small></span>
      <span class="arrow">›</span>
    </a>

    <!-- ========== フッター ========== -->
    <footer class="footer">
      © 赤羽歯科・フレンドデンタルオフィス
    </footer>

  </div>
</body>
</html>
